name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  e2e:
    name: Smoke (Playwright)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        # Content is served from Postgres now, so a smoke test with no Supabase
        # config asserts that the site 500s politely rather than that it works.
        # Both values are public by design (they ship in every browser bundle);
        # they are secrets here only so rotating one does not mean a commit.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

  deploy-preview:
    name: Deploy Preview
    if: github.event_name == 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install -g vercel@latest
      # Remote build: upload source and let Vercel build, instead of uploading a
      # large prebuilt bundle. Smaller upload (dodges "Upload aborted") and the
      # resulting deployments are redeployable from the Vercel dashboard. The
      # url=$(...) assignment fails the step if the deploy errors (no masking).
      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --token=${{ secrets.VERCEL_TOKEN }} --yes)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Comment preview URL on PR
        uses: actions/github-script@v9
        with:
          script: |
            const url = "${{ steps.deploy.outputs.url }}";
            const marker = "<!-- vercel-preview -->";
            const body = `${marker}\n🔍 **Preview deployment ready:** ${url}\n\n_Commit ${context.sha.slice(0, 7)}_`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  deploy-production:
    name: Deploy Production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install -g vercel@latest
      # Remote build (see preview job). url=$(...) fails the step on deploy error.
      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes)
          echo "url=$url" >> "$GITHUB_OUTPUT"

  # One report per run, whatever happened. A green production deploy posts the
  # version and URL to #ship-log. Any failure, on a PR or on main, posts which
  # job failed and the first error line from its log, so the reason is in the
  # channel and not behind a login. Green PR runs stay quiet.
  report:
    name: Report to Discord
    if: always()
    needs: [quality, e2e, deploy-preview, deploy-production]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_SHIP_LOG }}
      GH_TOKEN: ${{ github.token }}
      RESULTS: ${{ toJSON(needs) }}
      DEPLOY_URL: ${{ needs.deploy-production.outputs.url }}
      SUBJECT: ${{ github.event.head_commit.message || github.event.pull_request.title }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: package.json
      - name: Post
        run: |
          if [ -z "$WEBHOOK" ]; then echo "No DISCORD_WEBHOOK_SHIP_LOG, skipping."; exit 0; fi
          failed=$(node -e '
            const r = JSON.parse(process.env.RESULTS);
            console.log(Object.entries(r).filter(([, v]) => v.result === "failure").map(([k]) => k).join(" "));
          ')
          if [ -n "$failed" ]; then
            # First real error line of the failed jobs. `gh run view --log-failed`
            # refuses a run that is still in progress, which this one is, so
            # read each completed failed job's log through the API instead.
            # Lines arrive as "timestamp text": drop the timestamp, skip HTML
            # error pages a gateway may return, prefer a line starting with
            # "Error", fall back to anything mentioning an error.
            : > failed.log
            for job in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
                --jq '.jobs[] | select(.conclusion == "failure") | .id'); do
              gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$job/logs" 2>/dev/null \
                | sed -E "s/^[0-9TZ:.-]+ //" | grep -vE "^\s*<|^\s*$" >> failed.log || true
            done
            error=$(grep -m1 -E "^(Error|error)[: ]" failed.log || grep -m1 -iE "error|failed" failed.log || true)
            error=$(printf "%s" "$error" | cut -c1-300)
            export FAILED="$failed" ERROR="$error"
            node -e '
              const where = process.env.PR_NUMBER ? `PR #${process.env.PR_NUMBER}` : process.env.GITHUB_REF_NAME;
              const subject = (process.env.SUBJECT ?? "").split("\n")[0];
              const lines = [
                `CI failed on ${where}: ${subject}`,
                `Failed: ${process.env.FAILED}`,
                process.env.ERROR ? `Error: ${process.env.ERROR}` : null,
                process.env.RUN_URL,
              ].filter(Boolean);
              process.stdout.write(JSON.stringify({ content: lines.join("\n"), username: "Binary Semaphore", allowed_mentions: { parse: [] } }));
            ' > payload.json
          elif [ "${{ needs.deploy-production.result }}" = "success" ]; then
            node -e '
              const version = require("./package.json").version;
              const subject = (process.env.SUBJECT ?? "").split("\n")[0];
              const content = `Deployed v${version} to production: ${subject}\n${process.env.DEPLOY_URL}`;
              process.stdout.write(JSON.stringify({ content, username: "Binary Semaphore", allowed_mentions: { parse: [] } }));
            ' > payload.json
          else
            echo "Green run on a PR; nothing to report."; exit 0
          fi
          # curl prints 000 when it cannot connect, so check both bounds.
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Content-Type: application/json" --data @payload.json "$WEBHOOK")
          echo "Discord webhook: $code"
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]
